[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-risk-score-model"
version = "0.1.0"
description = "Intelligent Data Solution for Disaster Risk Reduction (IDS-DRR): configurable flood risk scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "CivicDataLab" }]
keywords = ["disaster-risk", "flood", "topsis", "sendai", "dpg"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "geopandas==0.14.4",
    "jenkspy==0.4.1",
    "matplotlib==3.9.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "PuLP==2.8.0",
    "requests==2.32.3",
    "scikit-learn==1.5.1",
    "scipy==1.12.0",
    "seaborn==0.13.2",
    "tqdm==4.66.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
drsm = "disaster_risk_score_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"disaster_risk_score_model" = ["config_templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
