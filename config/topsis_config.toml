# TOPSIS composite risk score configuration.
# See docs/topsis_risk_score.md for methodology detail.

[weights]
# Relative weights for each factor in the TOPSIS aggregation.
# Higher weight = greater influence on the composite risk score.
# Rationale: flood-hazard is the primary driver; exposure is a context factor.
flood_hazard        = 4
exposure            = 1
vulnerability       = 2
government_response = 2

[classification]
# Number of equal-width bins for the composite risk score (1 = lowest, n = highest risk).
n_bins = 5

[paths]
# Paths relative to the repository root.
district_lookup_file = "data/district_objectid.csv"
output_file          = "data/risk_score.csv"
final_output_file    = "data/risk_score_district.csv"

[cumulative_vars]
# These columns get financial-year running cumulative sums recomputed inside the TOPSIS
# script (independently of the cumulative sums in govtresponse.py) for use as platform
# display indicators. Remove any column not present in your data.
variables = [
    "total_procurement_value",
    "disaster_fund_sanctions_value",
]

# District-level indicator columns and their aggregation rules.
# Keys are post-rename column names (lowercase kebab-case).
# Values are pandas aggregation functions: "sum", "mean", "max", "min", or "first".
# Add or remove rows to match the columns present in your data. The script only
# aggregates columns that actually exist, so extra rows are ignored harmlessly.
[indicators]
"total-procurement-value"                  = "sum"
"disaster-fund-sanctions-value"            = "first"
"disaster-fund-procurement-value"          = "sum"
"total-procurement-value-fy-cumsum"        = "sum"
"disaster-fund-sanctions-value-fy-cumsum"  = "first"
"flood-protection-failures"                = "sum"
"flood-protection-damaged"                 = "sum"
"roads"                                    = "sum"
"bridge"                                   = "sum"
"sum-population"                           = "sum"
"total-hhd"                                = "sum"
"inundation-intensity-sum"                 = "sum"
"human-live-lost"                          = "sum"
"population-affected-total"                = "sum"
"crop-area"                                = "sum"
"sum-aged-population"                       = "sum"
"schools-count"                            = "sum"
"health-centres-count"                     = "sum"
"road-length"                              = "sum"
"rail-length"                              = "sum"
"area-sqkm"                                = "sum"
"net-sown-area-in-hac"                     = "sum"
"no-sanitation-hhds-pct"                   = "mean"
"piped-water-hhds-pct"                     = "mean"
"avg-electricity"                          = "mean"
"mean-sex-ratio"                           = "mean"
"drainage-density"                         = "mean"
"inundation-intensity-mean-nonzero"        = "mean"
"mean-rain"                                = "mean"
"efficiency"                               = "mean"
"topsis-score"                             = "mean"
"max-rain"                                 = "max"
"financial-year"                           = "first"

# Decimal places to round output columns to. Omit a column to leave it unrounded.
[rounding]
"avg-electricity"                   = 1
"mean-sex-ratio"                    = 2
"piped-water-hhds-pct"              = 2
"no-sanitation-hhds-pct"            = 2
"inundation-intensity-mean-nonzero" = 2
"inundation-intensity-sum"          = 2
"max-rain"                          = 2
"mean-rain"                         = 2
"sum-aged-population"               = 0
"sum-population"                    = 0
"rail-length"                       = 0
"road-length"                       = 0
"crop-area"                         = 0
