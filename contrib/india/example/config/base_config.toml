# Base configuration shared by all factor scripts.
# Edit this file to match your input data column names and folder layout.

[paths]
# Path to the data folder, relative to the repository root.
# This is the India (Assam) reference example; its data lives under contrib/.
data_folder = "contrib/india/example/data"
input_file  = "MASTER_VARIABLES.csv"

[columns]
# Column names in MASTER_VARIABLES.csv that every script requires.
time_column     = "timeperiod"
object_id_column = "object_id"
