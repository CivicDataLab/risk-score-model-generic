# Optional, geography-specific post-processing of the final output, applied by
# topsis_riskscore.py. Keys are snake_case column names (kebab-cased automatically
# on output).

# Multiply a column in place by a constant factor (here: fraction -> percentage).
[derivations.scale]
inundation_pct = 100

# Create a new column as the row-wise sum of components (only if all are present).
[derivations.sum]
total_infrastructure_damage = ["total_houses_fully_damaged", "roads_damaged", "bridges_damaged"]

# Rename output columns (missing names are ignored). Tenders flagged as
# "Preparedness Measures" are surfaced on the platform as restoration measures.
[renames]
preparedness_measures_tenders_awarded_value = "restoration_measures_tenders_awarded_value"
